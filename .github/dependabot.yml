version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      babylonjs:
        patterns:
          - "@babylonjs/*"
      dev-dependencies:
        dependency-type: development
    ignore:
      # @typescript-eslint peers cap TypeScript below 6.1, so a major bump
      # breaks `npm ci`. Drop this once the eslint tooling supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
